services:
  - type: web
    name: viviani-api
    runtime: node
    rootDir: .
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @viviani/types build && corepack pnpm --filter @viviani/utils build && corepack pnpm --filter @viviani/api db:generate && corepack pnpm --filter @viviani/api db:migrate:prod && corepack pnpm --filter @viviani/api build
    startCommand: APP_VERSION=${RENDER_GIT_COMMIT:-$APP_VERSION} corepack pnpm --filter @viviani/api start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: LOG_LEVEL
        value: info
      - key: LOG_TO_FILES
        value: "false"
      - key: STORAGE_DRIVER
        value: supabase
      # Database (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # Upstash Redis
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Supabase Storage
      - key: SUPABASE_URL
        value: https://szfaeshmiriosnrfzdqb.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      # API URLs
      - key: API_BASE_URL
        sync: false
      - key: CRM_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Auth
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANONYMIZATION_SALT
        sync: false
      # Optional
      - key: LANDING_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: ALLOW_BASELINE_RESET
        value: "false"
