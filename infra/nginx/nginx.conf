user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time"';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 60s;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # ── Security headers (global) ─────────────────────────────────────────────
    add_header X-Frame-Options             "DENY" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    server_tokens off;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:20m      rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=landing:20m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=crm:10m      rate=5r/s;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    # ── Bad bot / scanner UA blocklist ────────────────────────────────────────
    map $http_user_agent $bad_bot {
        default         0;
        ~*sqlmap        1;
        ~*nikto         1;
        ~*masscan       1;
        ~*nmap          1;
        ~*zgrab         1;
        ~*nuclei        1;
        ~*dirbuster     1;
        ~*gobuster      1;
        ~*hydra         1;
        ~*python-requests 1;
        ~*go-http-client  1;
        ""              1;
    }

    # ── Proxy cache ───────────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g
                     inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
