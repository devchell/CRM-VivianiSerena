version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: viviani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viviani_db}
      POSTGRES_USER: ${POSTGRES_USER:-viviani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viviani} -d ${POSTGRES_DB:-viviani_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viviani_network

  redis:
    image: redis:7-alpine
    container_name: viviani_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viviani_network

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: viviani_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-viviani}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-viviani_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api/uploads:/app/uploads
      - ./apps/api/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - viviani_network

  landing:
    build:
      context: .
      dockerfile: infra/docker/landing/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: viviani_landing
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
    ports:
      - "${LANDING_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - viviani_network

  crm:
    build:
      context: .
      dockerfile: infra/docker/crm/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: viviani_crm
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-http://localhost:3000}
    ports:
      - "${CRM_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - viviani_network

  nginx:
    image: nginx:1.25-alpine
    container_name: viviani_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - landing
      - crm
      - api
    networks:
      - viviani_network
    profiles:
      - production

  backup:
    image: postgres:16-alpine
    container_name: viviani_backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viviani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-viviani_db}
      POSTGRES_HOST: postgres
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache dcron
        echo "0 2 * * * PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz && find /backups -name '*.sql.gz' -mtime +$$BACKUP_RETAIN_DAYS -delete && echo 'Backup OK'" | crontab -
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viviani_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  viviani_network:
    driver: bridge
