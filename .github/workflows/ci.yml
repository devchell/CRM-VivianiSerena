name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@postgres.example.com:5432/viviani_db?schema=public
      REDIS_URL: rediss://default:placeholder@redis.example.com:6379
      API_BASE_URL: https://api.example.com
      NEXT_PUBLIC_API_URL: https://api.example.com
      CRM_URL: https://crm.example.com
      NEXTAUTH_SECRET: placeholder-nextauth-secret
      NEXTAUTH_URL: https://crm.example.com
      NEXT_PUBLIC_LANDING_URL: https://example.com
      NEXT_PUBLIC_APP_VERSION: ci
      CORS_ORIGIN: https://example.com,https://crm.example.com
      REVALIDATE_SECRET: placeholder-revalidate-secret
      JWT_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        replace-me
        -----END RSA PRIVATE KEY-----
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        replace-me
        -----END PUBLIC KEY-----
      ENCRYPTION_KEY: placeholder-encryption-key-123456
      ANONYMIZATION_SALT: placeholder-anon-salt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test API
        run: pnpm --filter @viviani/api test

      - name: Build shared packages
        run: pnpm --filter @viviani/types build && pnpm --filter @viviani/utils build && pnpm --filter @viviani/ui build

      - name: Build API
        run: pnpm --filter @viviani/api db:generate && pnpm --filter @viviani/api build

      - name: Build CRM
        run: pnpm --filter @viviani/crm build

      - name: Build Landing
        run: pnpm --filter @viviani/landing build
