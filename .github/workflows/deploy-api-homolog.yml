name: Deploy API Homologation

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - staging
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-api-homolog-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      has_hook: ${{ steps.check.outputs.has_hook }}
      has_base_url: ${{ steps.check.outputs.has_base_url }}
      has_admin_smoke: ${{ steps.check.outputs.has_admin_smoke }}
    steps:
      - name: Check required secrets and variables
        id: check
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_API_HML: ${{ secrets.RENDER_DEPLOY_HOOK_API_HML }}
          API_HML_BASE_URL: ${{ vars.API_HML_BASE_URL }}
          API_HML_SMOKE_ADMIN_EMAIL: ${{ secrets.API_HML_SMOKE_ADMIN_EMAIL }}
          API_HML_SMOKE_ADMIN_PASSWORD: ${{ secrets.API_HML_SMOKE_ADMIN_PASSWORD }}
        run: |
          if [[ -n "${RENDER_DEPLOY_HOOK_API_HML}" ]]; then
            echo "has_hook=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_hook=false" >> "${GITHUB_OUTPUT}"
            echo "RENDER_DEPLOY_HOOK_API_HML secret not configured; skipping API deploy workflow."
          fi

          if [[ -n "${API_HML_BASE_URL}" ]]; then
            echo "has_base_url=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_base_url=false" >> "${GITHUB_OUTPUT}"
            echo "API_HML_BASE_URL variable not configured; skipping API health verification."
          fi

          if [[ -n "${API_HML_SMOKE_ADMIN_EMAIL}" && -n "${API_HML_SMOKE_ADMIN_PASSWORD}" ]]; then
            echo "has_admin_smoke=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_admin_smoke=false" >> "${GITHUB_OUTPUT}"
            echo "Admin smoke secrets not configured; workflow will verify only public health/version."
          fi

  deploy-api-hml:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_hook == 'true' && needs.preflight.outputs.has_base_url == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment SHA
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy_sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.deploy_sha }}

      - name: Trigger Render deploy
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_API_HML: ${{ secrets.RENDER_DEPLOY_HOOK_API_HML }}
        run: |
          curl --fail --show-error --silent -X POST "${RENDER_DEPLOY_HOOK_API_HML}"

      - name: Verify deployed API
        shell: pwsh
        env:
          API_HML_BASE_URL: ${{ vars.API_HML_BASE_URL }}
          DEPLOY_SHA: ${{ steps.meta.outputs.deploy_sha }}
          API_HML_SMOKE_ADMIN_EMAIL: ${{ secrets.API_HML_SMOKE_ADMIN_EMAIL }}
          API_HML_SMOKE_ADMIN_PASSWORD: ${{ secrets.API_HML_SMOKE_ADMIN_PASSWORD }}
        run: |
          $params = @{
            ApiBaseUrl = $env:API_HML_BASE_URL
            ExpectedVersion = $env:DEPLOY_SHA
            MaxAttempts = 60
            DelaySeconds = 10
          }

          if ($env:API_HML_SMOKE_ADMIN_EMAIL -and $env:API_HML_SMOKE_ADMIN_PASSWORD) {
            $params.AdminEmail = $env:API_HML_SMOKE_ADMIN_EMAIL
            $params.AdminPassword = $env:API_HML_SMOKE_ADMIN_PASSWORD
          }

          ./scripts/verify-api-deploy.ps1 @params
