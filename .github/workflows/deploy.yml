name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_vercel_token: ${{ steps.check.outputs.has_vercel_token }}
      has_render_hook: ${{ steps.check.outputs.has_render_hook }}
    steps:
      - name: Check secrets
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [[ -n "${VERCEL_TOKEN}" ]]; then
            echo "has_vercel_token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_vercel_token=false" >> "${GITHUB_OUTPUT}"
            echo "VERCEL_TOKEN not configured; skipping Vercel deploys."
          fi

          if [[ -n "${RENDER_DEPLOY_HOOK_API}" ]]; then
            echo "has_render_hook=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_render_hook=false" >> "${GITHUB_OUTPUT}"
            echo "RENDER_DEPLOY_HOOK_API not configured; skipping API deploy."
          fi

  deploy-landing:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_vercel_token == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.1
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Install Vercel CLI
        working-directory: .
        run: npm install --global vercel@latest

      - name: Pull Vercel config
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_LANDING }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build landing
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_LANDING }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy landing
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_LANDING }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-crm:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_vercel_token == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.1
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Install Vercel CLI
        working-directory: .
        run: npm install --global vercel@latest

      - name: Pull Vercel config
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_CRM }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build CRM
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_CRM }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy CRM
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_CRM }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-api:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_render_hook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trigger Render deploy
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          curl --fail --show-error --silent -X POST "${RENDER_DEPLOY_HOOK_API}"
          echo "Render deploy triggered successfully."
